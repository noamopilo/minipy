[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minipy-tools"
version = "0.1.3"
description = ""
authors = [{name = "Noé Ballieu", email = "nonobal2812@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "inquirer",
    "click",
    "python-dotenv",
    "requests",
    "PyPDF2",
    "Pillow",
    "qrcode",
    "yt-dlp",
    "pyaudio",
    "pynput",
    "pillow"
]

[project.scripts]
minipy = "minipy.main:main"

[tool.setuptools.packages.find]
include = ["minipy*"]
